<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght=600;700&family=Rubik+Mono+One&family=Inter:wght=700;900&family=Teko:wght=600&display=swap" rel="stylesheet">
    <title>Padel Overlay</title>
    <style>
        :root {
            --accent-blue: #0055ff;
            --gold: #ffd700;
            --ball-color: #ccff00;
            --panel-bg: rgba(60, 60, 60, 0.7);
            --drawer-bg: rgba(40, 40, 40, 0.8);
            --score-num-color: #ffffff;
            --sets-num-color: #ffffff;
            --set-box-bg: rgba(255, 255, 255, 0.1);
            --team-name-color: #ffffff;
            --set-label-color: rgba(255, 255, 255, 0.5);
            --team-font-family: 'Oswald', sans-serif;
            --cell-border: rgba(255, 255, 255, 0.1);
            --sb-w: 680px;
            --sb-h: 120px;
            --sb-radius: 10px;
            --sb-skew: 0deg;
            --sb-top: 40px;
            --sb-left: 40px;
            --logo-w: 35%;
            --logo-h: 50%;
            --popup-bg: #444444;
            --popup-text: #ffffff;
            --finish-bg: rgba(20, 20, 26, 0.75);
            /* theme-derived variables (updated by JS) */
            --theme-card-bg: rgba(14, 14, 18, 0.52);
            --theme-card-border: rgba(255,255,255,0.12);
            --theme-card-title: rgba(255,255,255,0.35);
            --theme-winner-box-bg: linear-gradient(135deg, #0066ff, #0033cc);
            --theme-winner-box-border: #0077ff;
            --theme-winner-box-glow: rgba(0,85,255,0.7);
            --theme-finish-title-shadow: rgba(0,85,255,0.6);
            --theme-vs-color: var(--accent-blue);
            --theme-vs-shadow: var(--accent-blue);
            --theme-time-label-color: #7eb8ff;
        }
        html, body {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: transparent; color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
 
        @webkit-keyframes board-hide-left {
            0% { opacity: 1; transform: scale(var(--actual-scale, 1)) translateX(0); }
            100% { opacity: 0; transform: scale(var(--actual-scale, 1)) translateX(-250px); filter: blur(4px); }
        }
        @keyframes board-hide-left {
            0% { opacity: 1; transform: scale(var(--actual-scale, 1)) translateX(0); }
            100% { opacity: 0; transform: scale(var(--actual-scale, 1)) translateX(-250px); filter: blur(4px); }
        }
 
        /* КОМПЛЕКС ТАБЛА З ТОНЕНЬКОЮ СІРОЮ ЛІНІЄЮ КОНТУРУ */
        #scoreboard-anchor {
            position: absolute;
            top: var(--sb-top, 40px);
            left: var(--sb-left, 40px);
            width: var(--sb-w); height: var(--sb-h);
            display: flex; align-items: stretch;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--sb-radius);
            box-sizing: border-box;
        }
        #scoreboard-anchor.hidden-board {
            animation: board-hide-left 0.55s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            pointer-events: none;
        }
        
        /* ЛОГОТИП — прозорий фон, впритул, розмір по табло */
        #logo-container {
            position: relative;
            width: var(--sb-h);
            height: 100%;
            background: transparent;
            border-radius: var(--sb-radius) 0 0 var(--sb-radius);
            padding: 0;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; z-index: 3;
            margin-right: calc(var(--sb-h) * -1);
            transform: translateX(-30px);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.35s ease, margin-right 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            box-sizing: border-box;
            flex-shrink: 0;
            overflow: hidden;
        }
        #logo-container.active { transform: translateX(0); opacity: 1; margin-right: 0; }
        #logo-container img { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        .popup-label {
            position: absolute; background: var(--popup-bg); color: var(--popup-text); padding: 5px 25px;
            font-size: 13px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.4s; opacity: 0; z-index: 1;
        }
        #proset-indicator { top: -35px; left: 40%; border-radius: 6px 6px 0 0; }
        #proset-indicator.active { opacity: 1; transform: translateY(-10px); }
        
        #scoreboard-main {
            flex: 1; background: var(--panel-bg); border-left: 12px solid var(--accent-blue);
            display: flex; flex-direction: column; position: relative; z-index: 2;
            border-radius: 0 var(--sb-radius) var(--sb-radius) 0; transform: skewX(var(--sb-skew)); overflow: hidden;
        }
 
        /* Якщо логотип вимкнено, лівий край стає закругленим */
        #logo-container:not(.active) + #scoreboard-main {
            border-radius: var(--sb-radius) var(--sb-radius) var(--sb-radius) var(--sb-radius) !important;
        }
        .inner-content { transform: skewX(calc(var(--sb-skew) * -1)); height: 100%; display: flex; flex-direction: column; position: relative; }
        
        @-webkit-keyframes sb-glow-in  { 0%{opacity:0} 100%{opacity:1} }
        @-webkit-keyframes sb-glow-out { 0%{opacity:1} 100%{opacity:0} }
        @keyframes sb-glow-in  { 0%{opacity:0} 100%{opacity:1} }
        @keyframes sb-glow-out { 0%{opacity:1} 100%{opacity:0} }
 
        #sb-glow-ring {
            position: absolute; inset: -4px; border-radius: calc(var(--sb-radius) + 4px);
            pointer-events: none; z-index: 200; opacity: 0;
            box-shadow: 0 0 0 2px var(--glow-color, var(--accent-blue)),
                        0 0 24px 4px var(--glow-color, var(--accent-blue)),
                        0 0 60px 10px var(--glow-color, var(--accent-blue));
        }
        #sb-glow-ring.glow-active { animation: sb-glow-in 0.35s ease forwards; }
        #sb-glow-ring.glow-out    { animation: sb-glow-out 0.45s ease forwards; }
 
        #scoreboard-fullscreen-alert {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; background: transparent;
            z-index: 201; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }
 
        @-webkit-keyframes wipe-in  { 0%{transform:translateX(100%)} 100%{transform:translateX(0%)} }
        @-webkit-keyframes wipe-out { 0%{transform:translateX(0%)}   100%{transform:translateX(-100%)} }
        @keyframes wipe-in  { 0%{transform:translateX(100%)} 100%{transform:translateX(0%)} }
        @keyframes wipe-out { 0%{transform:translateX(0%)}   100%{transform:translateX(-100%)} }
 
        .alert-wipe-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--glow-color, var(--accent-blue));
            opacity: 0.93; transform: translateX(100%);
        }
        .alert-wipe-bg.wipe-in  { animation: wipe-in  0.30s cubic-bezier(0.4,0,0.2,1) forwards; }
        .alert-wipe-bg.wipe-out { animation: wipe-out 0.30s cubic-bezier(0.4,0,0.2,1) forwards; }
 
        @-webkit-keyframes txt-appear {
            0%  { opacity:0; transform:scale(0.82) translateY(6px); letter-spacing:8px; }
            100%{ opacity:1; transform:scale(1)    translateY(0);   letter-spacing:4px; }
        }
        @-webkit-keyframes txt-gone { 0%{opacity:1} 100%{opacity:0} }
        @keyframes txt-appear {
            0%  { opacity:0; transform:scale(0.82) translateY(6px); letter-spacing:8px; }
            100%{ opacity:1; transform:scale(1)    translateY(0);   letter-spacing:4px; }
        }
        @keyframes txt-gone { 0%{opacity:1} 100%{opacity:0} }
 
        .alert-text-content {
            position: relative; z-index: 1;
            font-family: var(--team-font-family);
            font-size: calc(var(--sb-h) * 0.45);
            font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            color: #ffffff; text-shadow: 0 3px 18px rgba(0,0,0,0.55);
            opacity: 0; text-align: center; width: 100%; padding: 0 4%;
            box-sizing: border-box;
            white-space: nowrap;
        }
        .alert-text-content.txt-show {
            animation: txt-appear 0.28s 0.26s cubic-bezier(0.175,0.885,0.32,1.275) forwards,
                       txt-gone   0.28s 2.3s ease forwards;
        }
        .alert-golden-theme   { color: #ffffff !important; text-shadow: 0 2px 15px rgba(0,0,0,0.6) !important; }
        .alert-tiebreak-theme { color: #ffffff !important; }
        .alert-deuce-theme    { color: #ffffff !important; }
        
        .points-drawer {
            position: absolute; right: 0; top: 0; width: 18%; height: 100%;
            background: var(--drawer-bg); backdrop-filter: blur(12px); display: flex; flex-direction: column;
            z-index: 1; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; border-left: 2px solid var(--cell-border);
            transform: skewX(var(--sb-skew)) translateX(0); border-radius: 0 var(--sb-radius) var(--sb-radius) 0;
        }
        .points-active { transform: skewX(var(--sb-skew)) translateX(100%); }
        
        .point-box {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--sb-h) * 0.38); font-weight: 900; color: var(--score-num-color);
            font-family: 'Inter', sans-serif; transform: skewX(calc(var(--sb-skew) * -1));
            border-bottom: 2px solid var(--cell-border);
            box-sizing: border-box; overflow: hidden; text-align: center; width: 100%;
        }
        .player-row { display: flex; align-items: center; flex: 1; padding: 0 0 0 5%; border-bottom: 2px solid var(--cell-border); overflow: hidden; position: relative; transition: background-color 0.3s; }
        .player-name { flex: 1; font-size: calc(var(--sb-h) * 0.28); color: var(--team-name-color); font-family: var(--team-font-family); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
        .sets-history { display: flex; height: 100%; border-left: 2px solid var(--cell-border); align-items: center; }
        .set-box-wrapper { display: flex; flex-direction: column; align-items: center; padding: 0 14px; justify-content: center; border-right: 1px solid rgba(255,255,255,0.1); height: 100%; }
        .set-box {
            min-width: calc(var(--sb-h) * 0.45); height: calc(var(--sb-h) * 0.55);
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--sb-h) * 0.4); color: var(--sets-num-color); font-weight: 900;
            background: var(--set-box-bg); border-radius: 6px; text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .set-box.active { color: #fff; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.15); }
        .serve-dot {
            width: calc(var(--sb-h) * 0.16); height: calc(var(--sb-h) * 0.16);
            background-color: var(--ball-color); border-radius: 50%; margin: 0 15px; opacity: 0;
            box-shadow: 0 0 15px var(--ball-color); transition: opacity 0.3s, background 0.1s; flex-shrink: 0;
        }
        .serve-dot.active { opacity: 1; }
 
        .deuce-row-wipe { position: absolute; inset: 0; overflow: hidden; z-index: 25; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .deuce-row-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #4a235a 0%, #6c3483 60%, #7d3c98 100%); transform: translateX(100%); }
        .deuce-row-lbl { position: relative; z-index: 2; font-family: var(--team-font-family); font-size: calc(var(--sb-h) * 0.32); font-weight: 900; letter-spacing: 4px; color: #ffffff; text-transform: uppercase; opacity: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
        .deuce-row-bg.dr-in { animation: deuce-row-in 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .deuce-row-bg.dr-out { animation: deuce-row-out 0.28s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .deuce-row-lbl.dr-txt-show { animation: deuce-row-txt 0.22s 0.22s ease forwards; }
 
        /* ── STATS OVERLAY ── */
        @-webkit-keyframes stats-in  { 0%{opacity:0;transform:scale(0.86) translateY(50px)} 65%{transform:scale(1.02) translateY(-4px);opacity:1} 100%{opacity:1;transform:scale(1) translateY(0)} }
        @-webkit-keyframes stats-out { 0%{opacity:1;transform:scale(1) translateY(0)} 100%{opacity:0;transform:scale(0.90) translateY(-35px)} }
        @keyframes stats-in  { 0%{opacity:0;transform:scale(0.86) translateY(50px)} 65%{transform:scale(1.02) translateY(-4px);opacity:1} 100%{opacity:1;transform:scale(1) translateY(0)} }
        @keyframes stats-out { 0%{opacity:1;transform:scale(1) translateY(0)} 100%{opacity:0;transform:scale(0.90) translateY(-35px)} }
        #tv-stats-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: transparent; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 15000;
        }
        #tv-stats-overlay.active   { animation: stats-in  0.65s cubic-bezier(0.25,1,0.5,1) forwards; }
        #tv-stats-overlay.closing  { animation: stats-out 0.45s cubic-bezier(0.4,0,0.2,1) forwards; }
        .stats-card {
            background: rgba(0,0,0,0.52);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
            width: fit-content; min-width: 480px; border-radius: 18px; padding: 28px 48px; position: relative; display: flex; flex-direction: column; gap: 12px;
        }
        .stats-card-title { font-size: 13px; font-weight: 900; color: var(--theme-card-title); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px; text-align: center; }
        .stats-table { min-width: 350px; border-collapse: collapse; }
        .stats-row { height: 86px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .stats-team-name { text-align: left; font-size: 36px; font-weight: bold; font-family: var(--team-font-family); padding-right: 40px; color: white; white-space: nowrap; text-transform: uppercase; }
        .stats-set-column { width: 95px; text-align: center; }
        .stats-games-num  { font-size: 46px; font-weight: 900; font-family: var(--team-font-family); color: white; }
        .stats-time-label { font-size: 30px; font-weight: 900; color: var(--theme-time-label-color); font-family: 'Inter', sans-serif; margin-top: 2px; letter-spacing: 0.5px; }
        
        /* ── ТАБЛО РЕЗУЛЬТАТУ / КІНЕЦЬ МАТЧУ ── */
        #match-finish-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 20000;
        }
        #match-finish-overlay.active { animation: finish-bg-in 0.5s ease forwards; pointer-events: auto; }
        #match-finish-overlay.closing { animation: finish-bg-out 0.5s ease forwards; pointer-events: none; }
        
        .finish-card {
            background: var(--theme-card-bg);
            width: fit-content; min-width: 620px; 
            border: 1px solid var(--theme-card-border);
            border-radius: 20px; padding: 25px 45px; 
            box-shadow: 0 35px 85px rgba(0,0,0,0.95);
            display: flex; flex-direction: column; gap: 18px; text-align: center; opacity: 0;
        }
        #match-finish-overlay.active .finish-card { animation: finish-card-in 0.55s 0.2s cubic-bezier(0.18,0.89,0.32,1.18) forwards; }
        #match-finish-overlay.closing .finish-card { animation: finish-card-out 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        
        .finish-title { font-size: 28px; font-weight: 900; letter-spacing: 3px; color: #ffffff; text-transform: uppercase; margin: 0; text-shadow: 0 0 15px var(--theme-finish-title-shadow), 0 2px 4px rgba(0,0,0,0.6); }
        .finish-table { min-width: 530px; border-collapse: collapse; margin-top: 5px; }
        .finish-row { border-bottom: 1px solid rgba(255,255,255,0.1); height: 75px; }
        .finish-team { text-align: left; font-size: 28px; font-weight: 800; font-family: var(--team-font-family); padding-left: 10px; color: #ffffff; padding-right: 40px; white-space: nowrap; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
        .finish-winner { color: var(--gold) !important; text-shadow: 0 0 15px rgba(255,215,0,0.6), 0 2px 4px rgba(0,0,0,0.8); }
        .finish-cell-set { width: 85px; text-align: center; }
        .finish-box-score { display: inline-block; min-width: 52px; height: 52px; line-height: 52px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; font-size: 28px; font-weight: 900; font-family: var(--team-font-family); color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .finish-box-score.winner-box { background: var(--theme-winner-box-bg); border: 1px solid var(--theme-winner-box-border); color: #ffffff; box-shadow: 0 0 20px var(--theme-winner-box-glow); text-shadow: 0 0 8px #ffffff, 0 2px 4px rgba(0,0,0,0.6); }
        
        /* ── DEUCE WIPE ── */
        #deuce-wipe-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 30; }
        #deuce-wipe-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #4a235a 0%, #6c3483 60%, #7d3c98 100%); transform: translateX(100%); box-shadow: inset 0 0 60px rgba(0,0,0,0.3); }
        #deuce-wipe-bg.dw-in  { animation: deuce-wipe-in  0.32s cubic-bezier(0.4,0,0.2,1) forwards; }
        #deuce-wipe-bg.dw-out { animation: deuce-wipe-out 0.32s cubic-bezier(0.4,0,0.2,1) forwards; }
        #deuce-wipe-label { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 18px; font-family: var(--team-font-family); font-size: calc(var(--sb-h) * 0.46); font-weight: 900; text-transform: uppercase; letter-spacing: 5px; color: #ffffff; white-space: nowrap; opacity: 0; text-shadow: 0 3px 20px rgba(0,0,0,0.5); pointer-events: none; }
        #deuce-wipe-label.dl-show { animation: deuce-txt-in  0.22s 0.26s ease forwards, deuce-txt-out 0.20s 0.9s  ease forwards; }
 
        /* ── FAULT WIPE ── */
        .fault-row-wipe { position: absolute; inset: 0; overflow: hidden; z-index: 26; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .fault-row-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #c0392b, #962d22); transform: translateX(100%); }
        .fault-row-lbl { position: relative; z-index: 2; font-family: var(--team-font-family); font-size: calc(var(--sb-h) * 0.26); font-weight: 900; letter-spacing: 3px; color: #ffffff; text-transform: uppercase; opacity: 0; }
        .fault-row-bg.fr-in { animation: fault-row-in 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .fault-row-bg.fr-out { animation: fault-row-out 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .fault-row-lbl.fr-txt-show { animation: fault-row-txt 0.18s 0.18s ease forwards; }
 
        /* ── BOTTOM NOTIF PLANK ── */
        #bottom-notif { 
            position: absolute; 
            top: 100%; 
            left: 50%; 
            width: fit-content; 
            min-width: 260px;
            padding: 0 38px; 
            height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            pointer-events: none; 
            z-index: 50; 
            transform: translateX(-50%) translateY(-22px); 
            opacity: 0; 
            box-sizing: border-box;
        }
        .bn-bg { position: absolute; inset: 0; background: rgba(30,30,35,0.85); border-left: 5px solid var(--bn-color, var(--accent-blue)); border-radius: 6px; backdrop-filter: blur(10px); box-shadow: 0 5px 22px rgba(0,0,0,0.55); }
        .bn-bg::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: var(--bn-color, var(--accent-blue)); opacity: 0.5; }
        .bn-text { position: relative; z-index: 1; font-family: var(--team-font-family); font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #ffffff; opacity: 0; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,0.85); }
        .bn-dot { position: relative; z-index: 1; width: 7px; height: 7px; border-radius: 50%; background: var(--bn-color, var(--accent-blue)); box-shadow: 0 0 8px var(--bn-color, var(--accent-blue)); margin-right: 10px; flex-shrink: 0; opacity: 0; }
        
        #bottom-notif.bn-show { animation: bn-slide-in 0.36s cubic-bezier(0.4,0,0.2,1) forwards; }
        #bottom-notif.bn-hide { animation: bn-slide-out 0.28s cubic-bezier(0.4,0,0.2,1) forwards; }
        #bottom-notif.bn-show .bn-text { animation: bn-txt-in 0.22s 0.28s ease forwards; }
        #bottom-notif.bn-show .bn-dot  { animation: bn-txt-in 0.18s 0.26s ease forwards; }
 
        #sponsor-logos-bar { 
            position: fixed; 
            top: 28px; 
            left: 50%; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            gap: 14px; 
            z-index: 9000; 
        }
        .sponsor-logo-wrap { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-sizing: border-box; 
            opacity: 0; 
            background: transparent; 
            border: none; box-shadow: none; backdrop-filter: none; padding: 0; 
        }
        .sponsor-logo-wrap.slw-show { animation: logo-pop-in  0.42s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        .sponsor-logo-wrap.slw-hide { animation: logo-pop-out 0.28s ease forwards; }
        .sponsor-logo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5)); }
 
        /* ── QR-КОД ── */
        #tv-qr-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: scale(0.85) translateY(15px);

    const firebaseConfig = {

    const pts = [0, 15, 30, 40, "AD"];
    let lastAlertKey = "";

    let animQueue = [];
    let animBusy  = false;
    function enqueueAnim(fn, duration) {
        animQueue.push({ fn, duration });
        if (!animBusy) drainQueue();
    }
    function drainQueue() {
        if (animQueue.length === 0) { animBusy = false; return; }
        animBusy = true;
        const { fn, duration } = animQueue.shift();
        if (typeof fn === 'function') fn();
        setTimeout(drainQueue, duration);
    }
 
    function playRowFaultWipe(faultTeam) {
        const rowEl = document.getElementById(`row-${faultTeam}`);
        if (!rowEl) return;
        let container = rowEl.querySelector('.fault-row-wipe');
        if (!container) {
            container = document.createElement('div');
            container.className = 'fault-row-wipe';
            container.innerHTML = '<div class="fault-row-bg"></div><div class="fault-row-lbl">DOUBLE FAULT</div>';
            rowEl.appendChild(container);
        }
        const bg = container.querySelector('.fault-row-bg');
        const lbl = container.querySelector('.fault-row-lbl');
        
        bg.classList.remove('fr-in', 'fr-out');
        lbl.classList.remove('fr-txt-show');
        void bg.offsetWidth;
        
        bg.classList.add('fr-in');
        setTimeout(() => lbl.classList.add('fr-txt-show'), 180);
        
        setTimeout(() => {
            lbl.classList.remove('fr-txt-show');
            bg.classList.remove('fr-in');
            bg.classList.add('fr-out');
            setTimeout(() => bg.classList.remove('fr-out'), 250);
        }, 1200);
    }
 
    function playDeuceWipe(text, color) {
        const bg  = document.getElementById('deuce-wipe-bg');
        const lbl = document.getElementById('deuce-wipe-label');
        const txt = document.getElementById('deuce-wipe-text');
        if (!bg || !lbl) return;
 
        if (color) bg.style.background = color;
        else bg.style.background = 'linear-gradient(135deg,#4a235a 0%,#6c3483 60%,#7d3c98 100%)';
 
        txt.textContent = text || 'DEUCE';
 
        bg.classList.remove('dw-in','dw-out');
        lbl.classList.remove('dl-show');
        void bg.offsetWidth;
 
        bg.classList.add('dw-in');
        setTimeout(() => lbl.classList.add('dl-show'), 280);
 
        setTimeout(() => {
            lbl.classList.remove('dl-show');
            bg.classList.remove('dw-in');
            bg.classList.add('dw-out');
            setTimeout(() => bg.classList.remove('dw-out'), 320);
        }, 1300);
    }
 
    /* ── кеш попередніх значень: оновлюємо DOM тільки якщо щось змінилось ── */
    let _cache = {};
    function _set(id, prop, val) {
        const key = id + '.' + prop;
        if (_cache[key] === val) return;
        _cache[key] = val;
        const el = document.getElementById(id);
        if (!el) return;
        if (prop === 'text') el.innerText = String(val);
        else if (prop === 'html') el.innerHTML = val;
    }
    function _css(prop, val) {
        if (_cache['css.' + prop] === val) return;
        _cache['css.' + prop] = val;
        document.documentElement.style.setProperty(prop, val);
    }
 
    function updateStyle(p, v) { _css(p, v); }
 
    function renderOverlay(d) {
        if (!d) return;
        const state = d.state || {};
        const ui = d.ui || {};
        const scores = state.scores || [0,0];
        const games = state.games || [0,0];
        const setsHistory = state.setsHistory || [[],[]];
        const server = state.server || 0;
        const isGameActive = state.isGameActive || false;
        const isTiebreak = state.isTiebreak || false;
        const isAmerican = state.isAmerican || false;
        const activeSetIndex = state.activeSetIndex || 0;
        const showFinish = state.showFinish || false;
        const showIntro = state.showIntro || false;
        const showLogo = state.showLogo || false;
        const showBoard = state.showBoard !== false;
        const isProset = state.isProset || false;
        const prosetLimit = state.prosetLimit || 8;
        const p1name = state.p1name || "Команда А";
        const p2name = state.p2name || "Команда Б";
        const courtName = state.courtName || "COURT 1";
 
        if (ui.accentBlue) {
            updateStyle('--accent-blue', ui.accentBlue);
            // Оновлюємо тематичні змінні карток під колір accent
            const hex = ui.accentBlue;
            const _r = parseInt(hex.slice(1,3),16)||0, _g = parseInt(hex.slice(3,5),16)||0, _b = parseInt(hex.slice(5,7),16)||0;
            updateStyle('--theme-card-bg', 'rgba(14, 14, 18, 0.52)');
            updateStyle('--theme-card-border', `rgba(${_r},${_g},${_b},0.35)`);
            updateStyle('--theme-card-title', `rgba(${_r},${_g},${_b},0.8)`);
            updateStyle('--theme-winner-box-bg', `linear-gradient(135deg, ${hex}cc, ${hex}99)`);
            updateStyle('--theme-winner-box-border', hex);
            updateStyle('--theme-winner-box-glow', `rgba(${_r},${_g},${_b},0.7)`);
            updateStyle('--theme-finish-title-shadow', `rgba(${_r},${_g},${_b},0.6)`);
            updateStyle('--theme-vs-color', hex);
            updateStyle('--theme-vs-shadow', hex);
            updateStyle('--theme-time-label-color', hex);
        }
        if (ui.ballColor) updateStyle('--ball-color', ui.ballColor);
        if (ui.panelBg) updateStyle('--panel-bg', ui.panelBg);
        if (ui.drawerBg) updateStyle('--drawer-bg', ui.drawerBg);
        if (ui.popupBg) updateStyle('--popup-bg', ui.popupBg);
        if (ui.popupText) updateStyle('--popup-text', ui.popupText);
        if (ui.teamNameColor) updateStyle('--team-name-color', ui.teamNameColor);
        if (ui.scoreColor) updateStyle('--score-num-color', ui.scoreColor);
        if (ui.finishBg) updateStyle('--finish-bg', ui.finishBg);
        if (ui.fontFamily) updateStyle('--team-font-family', ui.fontFamily);
        if (ui.sbW) updateStyle('--sb-w', ui.sbW);
        if (ui.sbH) updateStyle('--sb-h', ui.sbH);
        if (ui.sbRadius) updateStyle('--sb-radius', ui.sbRadius);
        if (ui.sbSkew) updateStyle('--sb-skew', ui.sbSkew);
        if (ui.sbScale) {
            updateStyle('--actual-scale', ui.sbScale);
            const anchor = document.getElementById('scoreboard-anchor');
            anchor.style.transform = `scale(${ui.sbScale})`;
            anchor.style.transformOrigin = 'top left';
        }
        if (ui.logoW) updateStyle('--logo-w', ui.logoW);
        if (ui.logoH) updateStyle('--logo-h', ui.logoH);
 
        if (ui.sbTop  !== undefined) document.documentElement.style.setProperty('--sb-top',  ui.sbTop   + 'px');
        if (ui.sbLeft !== undefined) document.documentElement.style.setProperty('--sb-left', ui.sbLeft + 'px');
 
        /* імена та корт — тільки при зміні */
        _set('p1-display', 'text', p1name);
        _set('p2-display', 'text', p2name);
        _set('intro-p1-display', 'text', p1name);
        _set('intro-p2-display', 'text', p2name);
        _set('intro-court-display', 'text', courtName);
 
        /* ЛОГІКА АВТОМАТИЧНОГО ПЕРЕМИКАННЯ ФОТО / ВІДЕО ЗІ ЗВУКОМ ДЛЯ КОМАНДИ 1 */
        const t1PhotoImg = document.getElementById('intro-t1-photo');
        const t1VideoEl = document.getElementById('intro-t1-video');
        const t1PhotoWrap = document.getElementById('intro-t1-photo-wrap');
        
        // photo-wrap завжди видима, placeholder схований якщо є фото
        t1PhotoWrap.style.display = 'flex';
        const t1Placeholder = document.getElementById('intro-t1-placeholder');
        if (ui.team1Photo) {
            if (t1Placeholder) t1Placeholder.style.display = 'none';
            if (ui.team1Photo.startsWith('data:video') || ui.team1Photo.includes('.mp4')) {
                t1PhotoImg.style.display = 'none';
                t1VideoEl.src = ui.team1Photo;
                t1VideoEl.muted = false;
                t1VideoEl.style.display = 'block';

            } else {
                t1VideoEl.style.display = 'none';
                t1VideoEl.src = '';
                t1PhotoImg.src = ui.team1Photo;
                t1PhotoImg.style.display = 'block';
            }
        } else {
            if (t1Placeholder) t1Placeholder.style.display = 'flex';
            t1PhotoImg.style.display = 'none';
            t1VideoEl.src = '';
            t1VideoEl.style.display = 'none';
        }
 
        /* ЛОГІКА АВТОМАТИЧНОГО ПЕРЕМИКАННЯ ФОТО / ВІДЕО ЗІ ЗВУКОМ ДЛЯ КОМАНДИ 2 */
        const t2PhotoImg = document.getElementById('intro-t2-photo');
        const t2VideoEl = document.getElementById('intro-t2-video');
        const t2PhotoWrap = document.getElementById('intro-t2-photo-wrap');
        
        // photo-wrap завжди видима, placeholder схований якщо є фото
        t2PhotoWrap.style.display = 'flex';

        if (ui.team2Photo) {
            if (t2Placeholder) t2Placeholder.style.display = 'none';
            if (ui.team2Photo.startsWith('data:video') || ui.team2Photo.includes('.mp4')) {
                t2PhotoImg.style.display = 'none';
                t2VideoEl.src = ui.team2Photo;
                t2VideoEl.muted = false;
                t2VideoEl.style.display = 'block';
                if(showIntro) t2VideoEl.play().catch(e => console.log(e));
            } else {
                t2VideoEl.style.display = 'none';

                t2PhotoImg.src = ui.team2Photo;

        } else {

            t2PhotoImg.style.display = 'none';
            t2VideoEl.src = '';
            t2VideoEl.style.display = 'none';

        const t1LogoImg = document.getElementById('intro-t1-logo');
        if (ui.team1Logo) { t1LogoImg.src = ui.team1Logo; t1LogoImg.style.display = 'block'; }
        else { t1LogoImg.src = ''; t1LogoImg.style.display = 'none'; }
 
        const t2LogoImg = document.getElementById('intro-t2-logo');

        else { t2LogoImg.src = ''; t2LogoImg.style.display = 'none'; }
 
        const getL = (i) => {
            if (isAmerican || isTiebreak) return String(scores[i]);
            if (scores[i] === 4) return "AD";
            if (scores[1-i] === 4) return "";
            return String(pts[scores[i]]);
        };
        const l0 = String(getL(0)), l1 = String(getL(1));
        _set('p1-score', 'text', l0);
        _set('p2-score', 'text', l1);
        
        const drawerEl = document.getElementById('drawer');
        const wantActive = isGameActive;
        if (drawerEl && _cache['drawer.active'] !== wantActive) {
            _cache['drawer.active'] = wantActive;

        }
 
        const logoSrcVal = ui.logoSrc || '';
        if (_cache['logo-img.src'] !== logoSrcVal) { _cache['logo-img.src'] = logoSrcVal; if (logoSrcVal) document.getElementById('logo-img').src = logoSrcVal; }
        const logoActive = !!(showLogo && logoSrcVal);
        if (_cache['logo-container.active'] !== logoActive) { _cache['logo-container.active'] = logoActive; document.getElementById('logo-container').classList.toggle('active', logoActive); }
 
        /* PRO-SET індикатор */
        const prosetEl = document.getElementById('proset-indicator');
        if (prosetEl) {
            const prosetKey = isProset ? 'on' + prosetLimit : 'off';
            if (_cache['proset.key'] !== prosetKey) {
                _cache['proset.key'] = prosetKey;
                prosetEl.classList.toggle('active', isProset);
                prosetEl.textContent = `PRO-SET ${prosetLimit}`;

        /* SPLIT SCREEN — паралельний матч */
        const splitOverlay = document.getElementById('split-screen-overlay');
        if (splitOverlay) {
            const showSplit = state.showSplitScreen || false;

                splitOverlay.style.display = 'flex';

                const selfUrl = window.location.href.split('?')[0] + window.location.search;
                if (ifrSelf && _cache['split-self'] !== selfUrl) { _cache['split-self'] = selfUrl; ifrSelf.src = selfUrl; }
                if (ifrOther && _cache['split-other'] !== splitUrl) { _cache['split-other'] = splitUrl; ifrOther.src = splitUrl; }
                const lbl1 = document.getElementById('split-label-1');
                const lbl2 = document.getElementById('split-label-2');
                if (lbl1) lbl1.textContent = courtName;
                if (lbl2) lbl2.textContent = splitUrl.match(/court=(\d+)/)?.[1] ? 'COURT ' + splitUrl.match(/court=(\d+)/)[1] : 'КОРТ 2';
            } else {
                splitOverlay.style.display = 'none';
                if (_cache['split-other']) { _cache['split-other'] = ''; const ifrOther = document.getElementById('split-iframe-2'); if(ifrOther) ifrOther.src = ''; }
            }

        /* СИНХРОНІЗАЦІЯ І ВИСУВАННЯ НИЖНЬОЇ ПЛАШКИ ЗНИЗУ */
        const bnEl   = document.getElementById('bottom-notif');

        if (!notif && isTiebreak) {

        if (notif && notif !== prevNotif) {
            let bnColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim() || '#0055ff';
            if (notif.includes('BREAK'))  bnColor = '#e67e22';

            bnEl.style.setProperty('--bn-color', bnColor);
            bnEl.dataset.lastNotif = notif;

            bnEl.classList.remove('bn-show', 'bn-hide');

            bnEl.classList.add('bn-show');
        } else if (!notif && prevNotif) {
            bnEl.dataset.lastNotif = '';
            bnEl.classList.remove('bn-show');
            bnEl.classList.add('bn-hide');
            setTimeout(() => bnEl.classList.remove('bn-hide'), 350);

        [0,1].forEach(p => {
            let h = ""; const historyArr = setsHistory[p] || [];
            historyArr.forEach(g => h += `<div class="set-box-wrapper"><div class="set-box">${g}</div></div>`);
            h += `<div class="set-box-wrapper"><div class="set-box active">${games[p]}</div></div>`;
            const setsId = `p${p+1}-sets`;
            if (_cache[setsId + '.html'] !== h) {
                _cache[setsId + '.html'] = h;
                document.getElementById(setsId).innerHTML = h;
            }
            const serveActive = server === p;
            if (_cache[`serve-${p}.active`] !== serveActive) {
                _cache[`serve-${p}.active`] = serveActive;
                document.getElementById(`serve-${p}`).classList.toggle('active', serveActive);
            }
        });
 
        const alertKey = state.alertKey || "";
        if (alertKey && alertKey !== lastAlertKey) {
            lastAlertKey = alertKey;
            
            if (alertKey.startsWith("FAULT_")) {
                const faultTeamId = parseInt(alertKey.split("_")[1]);
                enqueueAnim(() => playRowFaultWipe(faultTeamId), 1500);
            } else {
                const capturedMode = state.alertMode;
                const capturedText = state.alertText || "";
 
                if (capturedMode === 'deuce') {
                    enqueueAnim(() => playDeuceWipe('DEUCE', null), 1600);
                } else {
                    enqueueAnim(() => {
                        const ring  = document.getElementById('sb-glow-ring');
                        const el    = document.getElementById('scoreboard-fullscreen-alert');
                        const txtEl = document.getElementById('fullscreen-alert-text');
 
                        const glowMap = { golden:'#d4ac0d', tiebreak:'#c0392b', normal:null };
                        const _accentCol = getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim() || '#0055ff';
                        let glowColor = glowMap[capturedMode] || _accentCol;
                        
                        const txtUpper = capturedText.toUpperCase();
                        const isPointAlert = txtUpper.includes("BREAK") || txtUpper.includes("GAME") || txtUpper.includes("БРЕЙК") || txtUpper.includes("ГЕЙМ");
                        
                        if (isPointAlert) {
                            glowColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim() || '#0055ff';
                        }
 
                        ring.style.setProperty('--glow-color', glowColor);
                        el.style.setProperty('--glow-color', glowColor);
 
                        let bg = el.querySelector('.alert-wipe-bg');
                        if (!bg) { bg = document.createElement('div'); bg.className='alert-wipe-bg'; el.insertBefore(bg, txtEl); }
 
                        bg.classList.remove('wipe-in','wipe-out');
                        txtEl.classList.remove('txt-show');
                        void bg.offsetWidth;
 
                        txtEl.innerText = capturedText;
                        let cls = "alert-text-content";
                        if (capturedMode === 'golden')   cls += " alert-golden-theme";
                        if (capturedMode === 'tiebreak') cls += " alert-tiebreak-theme";
                        txtEl.className = cls;
 
                        ring.classList.remove('glow-out');
                        ring.classList.add('glow-active');
                        
                        if (isPointAlert) {
                            bg.style.background = getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim() || '#0055ff';
                        } else if (capturedMode === 'golden') {
                            bg.style.background = 'linear-gradient(135deg, #9a7d0a 0%, #b7950b 60%, #d4ac0d 100%)';
                        } else {
                            bg.style.background = glowColor;

                        bg.classList.add('wipe-in');
 
                        setTimeout(() => txtEl.classList.add('txt-show'), 260);
 
                        setTimeout(() => {
                            txtEl.classList.remove('txt-show');

                            bg.classList.add('wipe-out');
                            ring.classList.remove('glow-active');
                            ring.classList.add('glow-out');

                                bg.classList.remove('wipe-out');
                                ring.classList.remove('glow-out');

                        }, 2600);

                }

        }

            lastGoldenWinnerKey = goldenWinnerKey;

        if (state.showStats && !forceShowStats) {

            const statsEl = document.getElementById('tv-stats-overlay');
            statsEl.classList.remove('closing');
            statsEl.classList.add('active');
            
            if (statsTimeout) clearTimeout(statsTimeout);
            statsTimeout = setTimeout(() => {
                statsEl.classList.add('closing');
                setTimeout(() => {
                    statsEl.classList.remove('active', 'closing');
                    forceShowStats = false;

        /* BREAK STATS OVERLAY — persistent toggle */
        const bsoEl = document.getElementById('break-stats-overlay');
        if (bsoEl) {

            const hasBso  = bsoEl.classList.contains('bso-show') || bsoEl.classList.contains('bso-hide');
            const isShown = bsoEl.classList.contains('bso-show');
            if (wantBso && !isShown) {

                tbTxt.style.animation = "";
            }, 1500);
        } else if (!isTiebreak) {
            if(state.games && state.games[0]===0 && state.games[1]===0 && setsHistory[0].length===0) {
                state._lastTBKey = "";
            }
        }
 
        /* PRO-SET WIPE — один раз при вмиканні */
        const psBg  = document.getElementById('proset-wipe-bg');
        const psTxt = document.getElementById('proset-wipe-text');
        if (psBg && psTxt) {
            if (isProset && !_cache['proset.wipeShown']) {
                _cache['proset.wipeShown'] = true;
                psTxt.textContent = `PRO-SET ${prosetLimit}`;
                psBg.classList.remove('proset-wipe-active');
                psTxt.style.animation = '';
                void psBg.offsetWidth;
                psBg.classList.add('proset-wipe-active');
                psTxt.style.animation = 'tb-wipe-anim 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards';
                setTimeout(() => {
                    psBg.classList.remove('proset-wipe-active');
                    psTxt.style.animation = '';
                }, 1800);
            }
            if (!isProset) _cache['proset.wipeShown'] = false;
        }
 
        /* ГЕНЕРАЦІЯ ТА ВІДОБРАЖЕННЯ ТЕКСТУ ПІДПИСУ ВГОРІ */
        const showQR = state.showQR || state.hideScoreOnly || false;
        const qrUrl = state.qrUrl || state.qrLink || ui.qrUrl || "";
        const qrContainer = document.getElementById('tv-qr-container');
 
        if (showQR && qrUrl) {
            const encodedUrl = encodeURIComponent(qrUrl);
            document.getElementById('tv-qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&color=000000&bgcolor=ffffff&data=${encodedUrl}`;
            document.getElementById('tv-qr-text').textContent = state.qrText || "SCAN TO WATCH";
            qrContainer.classList.add('active');
        } else {
            qrContainer.classList.remove('active');
        }
 
        /* ЗАСТАВКА КАМЕРИ — підтримка фото, відео (зі звуком), YouTube */
        const camOverlay = document.getElementById('tv-camera-cover-overlay');
        const camImg     = document.getElementById('camera-cover-img');
        const camVideo   = document.getElementById('camera-cover-video');
        const camFrame   = document.getElementById('camera-cover-iframe');
        const camWasActive = camOverlay.classList.contains('active');
 
        if (state.showCameraCover) {
            if (!camWasActive) {
                camImg.style.display = 'none';
                camVideo.style.display = 'none';
                camFrame.style.display = 'none';
 
                if (ui.cameraVideoUrl) {
                    let videoLink = ui.cameraVideoUrl;
                    let videoId = '';
                    if (videoLink.includes('v=')) videoId = videoLink.split('v=')[1].split('&')[0];
                    else if (videoLink.includes('youtu.be/')) videoId = videoLink.split('youtu.be/')[1].split('?')[0];
                    else if (videoLink.includes('embed/')) videoId = videoLink.split('embed/')[1].split('?')[0];
                    if (videoId) videoLink = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=0&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0`;
                    camFrame.src = videoLink;
                    camFrame.style.display = 'block';
                } else if (ui.cameraAssetSrc && (ui.cameraAssetType === 'video' || ui.cameraAssetSrc.startsWith('data:video'))) {
                    camVideo.src = ui.cameraAssetSrc;
                    camVideo.muted = false;
                    camVideo.style.display = 'block';
                    camVideo.play().catch(() => { camVideo.muted = true; camVideo.play(); });
                } else if (ui.cameraAssetSrc) {
                    camImg.src = ui.cameraAssetSrc;
                    camImg.style.display = 'block';
                }
                camOverlay.classList.add('active');
            }
        } else {
            if (camWasActive) {
                camOverlay.classList.remove('active');
                camFrame.src = '';
                camVideo.pause();
                camVideo.src = '';
            }
        }
 
        window._currentUi = ui;
        if (ui.statLogoT && _cache['stat-logo-t'] !== ui.statLogoT) { _cache['stat-logo-t'] = ui.statLogoT; document.getElementById('stat-logo-t').src = ui.statLogoT; }
        if (ui.statLogoF && _cache['stat-logo-f'] !== ui.statLogoF) { _cache['stat-logo-f'] = ui.statLogoF; document.getElementById('stat-logo-f').src = ui.statLogoF; }
        renderSponsorLogos(ui.sponsorLogos || [], ui.sponsorLogoSize || 80);
    }
 
    function updateStatsPanel(state) {
        const n1 = state.p1name || "Команда А"; const n2 = state.p2name || "Команда Б";
        const titleEl = document.getElementById('stats-card-title');
        if (titleEl) titleEl.textContent = "СТАТИСТИКА МАТЧУ";
        const setsHistory = state.setsHistory || [[],[]]; const games = state.games || [0,0];
        const activeSetIndex = state.activeSetIndex || 0; const setTimes = state.setTimes || [];
        const setStartTime = state._setStartTime;
        
        let totalSets = Math.max(activeSetIndex + 1, (setsHistory[0] || []).length, 1);
        const nowElapsed = setStartTime ? Math.round((Date.now() - setStartTime) / 60000) : 0;
 
        let headHtml = `<tr style="color:rgba(255,255,255,0.32); font-size:11px; text-transform:uppercase; height:22px; letter-spacing:1px;">
            <th style="text-align:left; padding-left:6px;">Команда</th>`;
        for(let s=1; s<=totalSets; s++) headHtml += `<th style="width:100px;">Set ${s}</th>`;
        headHtml += `</tr>`;
        document.getElementById('stats-table-head').innerHTML = headHtml;
 
        let s1=[], s2=[];
        for(let i=0; i<totalSets; i++) {
            s1.push((setsHistory[0] && setsHistory[0][i] !== undefined) ? setsHistory[0][i] : (activeSetIndex===i ? games[0] : '-'));
            s2.push((setsHistory[1] && setsHistory[1][i] !== undefined) ? setsHistory[1][i] : (activeSetIndex===i ? games[1] : '-'));
        }
 
        function getSetTime(i) {
            if (setsHistory[0] && setsHistory[0][i] !== undefined) { return (setTimes && setTimes[i] > 0) ? `${setTimes[i]}'` : ''; }
            return nowElapsed > 0 ? `${nowElapsed}'` : '';
        }
 
        let bodyHtml = `<tr class="stats-row"><td class="stats-team-name">${n1}</td>`;
        for(let i=0; i<totalSets; i++) {
            const tLabel = getSetTime(i);
            bodyHtml += `<td class="stats-set-column">
                <div class="stats-games-num">${s1[i]}</div>
                ${tLabel ? `<div class="stats-time-label">${tLabel}</div>` : ''}
            </td>`;
        }
        bodyHtml += `</tr><tr class="stats-row" style="border:none;"><td class="stats-team-name">${n2}</td>`;
        for(let i=0; i<totalSets; i++) { bodyHtml += `<td class="stats-set-column"><div class="stats-games-num">${s2[i]}</div></td>`; }
        bodyHtml += `</tr>`;
        document.getElementById('stats-table-body').innerHTML = bodyHtml;
    }
 
    function updateFinishPanel(state) {
        const n1 = state.p1name || "Команда А"; const n2 = state.p2name || "Команда Б";
        const sh = state.setsHistory || [[],[]]; const st = state.setTimes || [];
        
        let totalSets = Math.max((sh[0] || []).length, (sh[1] || []).length, 1);
 
        let headHtml = `<th style="text-align:left; padding-left:20px;">Команда</th>`;
        for(let s=1; s<=totalSets; s++) headHtml += `<th class="finish-cell-set">S${s}</th>`;
        document.getElementById('finish-table-head').innerHTML = headHtml;
        
        let html = `<tr class="finish-row"><td class="finish-team">${n1}</td>`;
        for(let i=0; i<totalSets; i++){
            const v = (sh[0] && sh[0][i]!==undefined)?sh[0][i]:'-';
            const won = (sh[0] && sh[1] && sh[0][i]!==undefined && sh[1][i]!==undefined && sh[0][i]>sh[1][i]);
            html += `<td class="finish-cell-set"><span class="finish-box-score${won?' winner-box':''}">${v}</span>`;
            if(st && st[i] && i===0) html += `<div style="font-size:16px;color:var(--theme-time-label-color);margin-top:3px;font-weight:900;">${st[i]}'</div>`;
            html += `</td>`;
        }
        html += `</tr><tr class="finish-row" style="border:none;"><td class="finish-team">${n2}</td>`;
        for(let i=0; i<totalSets; i++){
            const v = (sh[1] && sh[1][i]!==undefined)?sh[1][i]:'-';
            const won = (sh[0] && sh[1] && sh[0][i]!==undefined && sh[1][i]!==undefined && sh[1][i]>sh[0][i]);
            html += `<td class="finish-cell-set"><span class="finish-box-score${won?' winner-box':''}">${v}</span>`;
            if(st && st[i] && i>0) html += `<div style="font-size:16px;color:var(--theme-time-label-color);margin-top:3px;font-weight:900;">${st[i]}'</div>`;
            html += `</td>`;
        }
        html += `</tr>`;
        document.getElementById('finish-table-body').innerHTML = html;
    }
 
    let _lastSponsorKeys = "";
    function renderSponsorLogos(logos, size) {
        const bar = document.getElementById('sponsor-logos-bar'); if (!bar) return;
        const sz = size || 80;
        const key = logos.map(l => l.src + l.visible).join('|') + '|sz' + sz;
        if (key === _lastSponsorKeys) return;
        _lastSponsorKeys = key;
        const visibleLogos = logos.filter(l => l.src && l.visible !== false);
        [...bar.children].forEach(el => { el.classList.remove('slw-show'); el.classList.add('slw-hide'); });
        setTimeout(() => {
            bar.innerHTML = '';
            visibleLogos.forEach((l, i) => {
                const wrap = document.createElement('div'); wrap.className = 'sponsor-logo-wrap';
                wrap.style.width = sz + 'px';
                wrap.style.height = Math.round(sz * 0.65) + 'px';
                const img = document.createElement('img'); img.src = l.src; img.alt = '';
                wrap.appendChild(img); bar.appendChild(wrap);
                setTimeout(() => wrap.classList.add('slw-show'), i * 80);
            });
        }, visibleLogos.length === 0 ? 0 : 300);
    }
 
    const urlParams = new URLSearchParams(window.location.search);
    const courtId = urlParams.get('court') || '1';
    document.title = `Padel Overlay — Court ${courtId}`;
 
    const gameRef = ref(db, `padel/court${courtId}`);
    onValue(gameRef, (snapshot) => { renderOverlay(snapshot.val()); });
    function updateBreakStatsPanel(state) {
        const n1 = state.p1name || "Команда А";
        const n2 = state.p2name || "Команда Б";
        const sh = state.setsHistory || [[],[]];
        const games = state.games || [0,0];
        const activeSetIndex = state.activeSetIndex || 0;
 
        const p1El = document.getElementById('bso-p1-name');
        const p2El = document.getElementById('bso-p2-name');
        if (p1El) p1El.textContent = n1;
        if (p2El) p2El.textContent = n2;
 
        const totalSets = Math.max(activeSetIndex + 1, (sh[0] || []).length, 1);
        let s1 = [], s2 = [];
        for (let i = 0; i < totalSets; i++) {
            s1.push((sh[0] && sh[0][i] !== undefined) ? sh[0][i] : (activeSetIndex === i ? games[0] : '-'));
            s2.push((sh[1] && sh[1][i] !== undefined) ? sh[1][i] : (activeSetIndex === i ? games[1] : '-'));
        }
 
        function buildSetCells(scores, oppScores) {
            let html = '';
            for (let i = 0; i < totalSets; i++) {
                const isCurrent = (sh[0] && sh[0][i] === undefined) && i === activeSetIndex;
                const isWon = !isCurrent && scores[i] !== '-' && oppScores[i] !== '-' && Number(scores[i]) > Number(oppScores[i]);
                let cls = 'bso-set-cell';
                if (isCurrent) cls += ' bso-current';
                else if (isWon) cls += ' bso-winner';
                html += `<div class="${cls}">${scores[i]}</div>`;
            }
            return html;
        }
 
        const p1Sets = document.getElementById('bso-p1-sets');
        const p2Sets = document.getElementById('bso-p2-sets');
        if (p1Sets) p1Sets.innerHTML = buildSetCells(s1, s2);
        if (p2Sets) p2Sets.innerHTML = buildSetCells(s2, s1);
    }
 
</script>
