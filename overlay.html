<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Rubik+Mono+One&family=Inter:wght@700;900&family=Teko:wght@600&display=swap" rel="stylesheet">
    <title>Padel Overlay</title>
    <style>
        :root {
            --accent-blue: #0055ff;
            --gold: #ffd700;
            --ball-color: #ccff00;
            --panel-bg: rgba(60, 60, 60, 0.7);
            --drawer-bg: rgba(40, 40, 40, 0.8);
            --score-num-color: #ffffff;
            --sets-num-color: #ffffff;
            --set-box-bg: rgba(255, 255, 255, 0.1);
            --team-name-color: #ffffff;
            --set-label-color: rgba(255, 255, 255, 0.5);
            --team-font-family: 'Oswald', sans-serif;
            --cell-border: rgba(255, 255, 255, 0.1);
            --sb-w: 680px;
            --sb-h: 120px;
            --sb-radius: 10px;
            --sb-skew: 0deg;
            --sb-top: 40px;
            --sb-left: 40px;
            --logo-w: 35%;
            --logo-h: 50%;
            --popup-bg: #444444;
            --popup-text: #ffffff;
            --finish-bg: rgba(255, 255, 255, 0.03);
        }
        html, body {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: transparent; color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        #scoreboard-anchor {
            position: absolute;
            top: var(--sb-top, 40px);
            left: var(--sb-left, 40px);
            width: var(--sb-w); height: var(--sb-h);
            display: flex; align-items: stretch;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
        }
        #scoreboard-anchor.hidden-board { opacity: 0; pointer-events: none; transform: translateY(20px); }
        #logo-container {
            position: absolute; left: 0; top: 0;
            /* Ширина пропорційна висоті табла, фіксована */
            width: calc(var(--sb-h) * 1.4);
            height: calc(var(--sb-h) * 0.55);
            background: transparent;
            border-radius: 8px 8px 0 0; padding: 8px 12px;
            display: flex; align-items: center; justify-content: center;
            /* Анімація: виїжджає вгору */
            transform: translateY(0); opacity: 0; z-index: 3;
            transition: transform 0.45s cubic-bezier(0.19, 1, 0.22, 1),
                        opacity 0.35s ease;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.18);
            box-sizing: border-box;
        }
        #logo-container.active { transform: translateY(-100%); opacity: 1; }
        #logo-container img { max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35)); }
        .popup-label {
            position: absolute; background: var(--popup-bg); color: var(--popup-text); padding: 5px 25px;
            font-size: 13px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.4s; opacity: 0; z-index: 1;
        }
        #tiebreak-panel { top: -35px; right: 25px; border-radius: 6px 6px 0 0; }
        #proset-indicator { top: -35px; left: 40%; border-radius: 6px 6px 0 0; }
        #tiebreak-panel.active, #proset-indicator.active { opacity: 1; transform: translateY(-10px); }
        #scoreboard-main {
            flex: 1; background: var(--panel-bg); border-left: 12px solid var(--accent-blue);
            display: flex; flex-direction: column; position: relative; z-index: 2;
            border-radius: var(--sb-radius) 0 0 var(--sb-radius); transform: skewX(var(--sb-skew)); overflow: hidden;
        }
        .inner-content { transform: skewX(calc(var(--sb-skew) * -1)); height: 100%; display: flex; flex-direction: column; position: relative; }
        /* ── GLOW RING (контур табла) ── */
        @keyframes sb-glow-in  { 0%{opacity:0} 100%{opacity:1} }
        @keyframes sb-glow-out { 0%{opacity:1} 100%{opacity:0} }

        #sb-glow-ring {
            position: absolute; inset: -4px; border-radius: calc(var(--sb-radius) + 4px);
            pointer-events: none; z-index: 200; opacity: 0;
            box-shadow: 0 0 0 2px var(--glow-color, var(--accent-blue)),
                        0 0 24px 4px var(--glow-color, var(--accent-blue)),
                        0 0 60px 10px var(--glow-color, var(--accent-blue));
        }
        #sb-glow-ring.glow-active { animation: sb-glow-in 0.35s ease forwards; }
        #sb-glow-ring.glow-out    { animation: sb-glow-out 0.45s ease forwards; }

        /* ── WIPE ALERT ── */
        #scoreboard-fullscreen-alert {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; background: transparent;
            z-index: 201; pointer-events: none;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes wipe-in  { 0%{transform:translateX(100%)} 100%{transform:translateX(0%)} }
        @keyframes wipe-out { 0%{transform:translateX(0%)}   100%{transform:translateX(-100%)} }

        .alert-wipe-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--glow-color, var(--accent-blue));
            opacity: 0.93; transform: translateX(100%);
        }
        .alert-wipe-bg.wipe-in  { animation: wipe-in  0.30s cubic-bezier(0.4,0,0.2,1) forwards; }
        .alert-wipe-bg.wipe-out { animation: wipe-out 0.30s cubic-bezier(0.4,0,0.2,1) forwards; }

        /* Текст — по центру, великий */
        @keyframes txt-appear {
            0%  { opacity:0; transform:scale(0.82) translateY(6px); letter-spacing:8px; }
            100%{ opacity:1; transform:scale(1)    translateY(0);   letter-spacing:4px; }
        }
        @keyframes txt-gone { 0%{opacity:1} 100%{opacity:0} }

        .alert-text-content {
            position: relative; z-index: 1;
            font-family: var(--team-font-family);
            font-size: calc(var(--sb-h) * 0.52);   /* більший */
            font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            color: #ffffff; text-shadow: 0 3px 18px rgba(0,0,0,0.55);
            opacity: 0; text-align: center; width: 100%; padding: 0 5%;
            box-sizing: border-box;
        }
        /* Текст тримається 2с (appear 0.28s → hold → gone at 2.3s) */
        .alert-text-content.txt-show {
            animation: txt-appear 0.28s 0.26s cubic-bezier(0.175,0.885,0.32,1.275) forwards,
                       txt-gone   0.28s 2.3s ease forwards;
        }
        .alert-golden-theme   { color: #1a1200 !important; }
        .alert-tiebreak-theme { color: #ffffff !important; }
        .alert-deuce-theme    { color: #ffffff !important; }
        .points-drawer {
            position: absolute; right: 0; top: 0; width: 18%; height: 100%;
            background: var(--drawer-bg); backdrop-filter: blur(12px); display: flex; flex-direction: column;
            z-index: 1; transition: 0.6s; border-left: 2px solid var(--cell-border);
            transform: skewX(var(--sb-skew)) translateX(0); border-radius: 0 var(--sb-radius) var(--sb-radius) 0;
        }
        .points-active { transform: skewX(var(--sb-skew)) translateX(100%); }
        .point-box {
            flex: 1; display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--sb-h) * 0.38); font-weight: 900; color: var(--score-num-color);
            font-family: 'Inter', sans-serif; transform: skewX(calc(var(--sb-skew) * -1));
            border-bottom: 2px solid var(--cell-border);
            box-sizing: border-box; overflow: hidden; text-align: center; width: 100%;
        }
        .player-row { display: flex; align-items: center; flex: 1; padding: 0 0 0 5%; border-bottom: 2px solid var(--cell-border); overflow: hidden; }
        .player-name { flex: 1; font-size: calc(var(--sb-h) * 0.28); color: var(--team-name-color); font-family: var(--team-font-family); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
        .sets-history { display: flex; height: 100%; border-left: 2px solid var(--cell-border); align-items: center; }
        .set-box-wrapper { display: flex; flex-direction: column; align-items: center; padding: 0 14px; justify-content: center; border-right: 1px solid rgba(255,255,255,0.1); height: 100%; }
        .set-box {
            min-width: calc(var(--sb-h) * 0.45); height: calc(var(--sb-h) * 0.55);
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--sb-h) * 0.4); color: var(--sets-num-color); font-weight: 900;
            background: var(--set-box-bg); border-radius: 6px; text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }
        .set-box.active { color: #fff; background: rgba(255,255,255,0.22); border: 1px solid rgba(255,255,255,0.15); }
        .serve-dot {
            width: calc(var(--sb-h) * 0.16); height: calc(var(--sb-h) * 0.16);
            background-color: var(--ball-color); border-radius: 50%; margin: 0 15px; opacity: 0;
            box-shadow: 0 0 15px var(--ball-color); transition: opacity 0.3s, background 0.1s; flex-shrink: 0;
        }
        .serve-dot.active { opacity: 1; }
        /* ── STATS OVERLAY ── */
        @keyframes stats-in  { 0%{opacity:0;transform:translateY(30px) scale(0.96)} 100%{opacity:1;transform:translateY(0) scale(1)} }
        @keyframes stats-out { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-20px) scale(0.97)} }
        #tv-stats-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 15000;
        }
        #tv-stats-overlay.active   { animation: stats-in  0.55s cubic-bezier(0.25,1,0.5,1) forwards; }
        #tv-stats-overlay.closing  { animation: stats-out 0.4s  ease forwards; }
        .stats-card {
            background: rgba(12, 12, 16, 0.55);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow: 0 12px 60px rgba(0,0,0,0.45),
                        0 0 0 1px rgba(255,255,255,0.03),
                        inset 0 1px 0 rgba(255,255,255,0.07);
            width: fit-content; min-width: 480px; border-radius: 22px; padding: 38px 54px;
            position: relative; display: flex; flex-direction: column; gap: 16px;
        }
        .stats-logo-left  { position: absolute; top: 15px; left: 20px;  height: 45px; max-width: 120px; object-fit: contain; }
        .stats-logo-right { position: absolute; top: 15px; right: 20px; height: 45px; max-width: 120px; object-fit: contain; }
        .stats-card-title { font-size: 13px; font-weight: 900; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px; text-align: center; }
        .stats-table { min-width: 350px; border-collapse: collapse; }
        .stats-row { height: 86px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .stats-team-name { text-align: left; font-size: 36px; font-weight: bold; font-family: var(--team-font-family); padding-right: 40px; color: white; white-space: nowrap; text-transform: uppercase; }
        .stats-set-column { width: 95px; text-align: center; }
        .stats-games-num  { font-size: 46px; font-weight: 900; font-family: var(--team-font-family); color: white; }
        .stats-time-label { font-size: 15px; font-weight: 900; color: #7eb8ff; font-family: 'Inter', sans-serif; margin-top: 1px; letter-spacing: 0.5px; }
        /* ── FINISH ANIMATION ── */
        @keyframes digit-breathe {
            0%,100%{ transform:scale(1)   translateY(0);   opacity:1; }
            25%    { transform:scale(1.18) translateY(-6px); opacity:1; }
            50%    { transform:scale(0.9)  translateY(4px);  opacity:0.8; }
            75%    { transform:scale(1.22) translateY(-10px);opacity:1; }
        }
        @keyframes digit-scatter {
            0%  { opacity:1; transform:scale(1) translateY(0); filter:blur(0); }
            60% { opacity:0.6; filter:blur(2px); }
            100%{ opacity:0; transform:scale(0.3) translateY(var(--sy,80px)) translateX(var(--sx,0px)); filter:blur(8px); }
        }
        @keyframes finish-bg-in  { 0%{opacity:0} 100%{opacity:1} }
        @keyframes finish-card-in{ 0%{opacity:0;transform:translateY(60px) scale(0.9)} 100%{opacity:1;transform:translateY(0) scale(1)} }

        .sb-digit {
            display: inline-block;
            transition: color 0.3s;
        }
        .sb-digit.breathing { animation: digit-breathe 0.7s ease-in-out infinite; }
        .sb-digit.scatter   { animation: digit-scatter 0.65s ease-in forwards; }

        #match-finish-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5,5,5,0.5); backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; z-index: 20000;
        }
        #match-finish-overlay.active { animation: finish-bg-in 0.5s ease forwards; pointer-events: auto; }
        .finish-card {
            background: var(--finish-bg); width: 720px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px; padding: 40px; box-shadow: 0 35px 80px rgba(0,0,0,0.95);
            display: flex; flex-direction: column; gap: 25px; text-align: center;
            opacity: 0;
        }
        #match-finish-overlay.active .finish-card { animation: finish-card-in 0.55s 1.8s cubic-bezier(0.18,0.89,0.32,1.28) forwards; }
        .finish-title { font-size: 34px; font-weight: 900; letter-spacing: 4px; color: var(--accent-blue); text-transform: uppercase; margin: 0; }
        .finish-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .finish-row { border-bottom: 1px solid rgba(255,255,255,0.06); height: 95px; }
        .finish-team { text-align: left; font-size: 32px; font-weight: bold; font-family: var(--team-font-family); padding-left: 20px; color: #f5f5f5; }
        .finish-winner { color: var(--gold) !important; text-shadow: 0 0 15px rgba(255,215,0,0.4); }
        .finish-cell-set { width: 85px; text-align: center; }
        .finish-box-score { display: inline-block; min-width: 65px; height: 65px; line-height: 65px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; font-size: 38px; font-weight: 900; font-family: var(--team-font-family); color: #cccccc; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .finish-box-score.winner-box { background: linear-gradient(135deg, rgba(0,85,255,0.5), rgba(0,40,150,0.65)); border: 1px solid rgba(0,85,255,0.8); color: #ffffff; box-shadow: 0 0 20px rgba(0,85,255,0.5); }
        /* ── DEUCE WIPE: накриває все табло справа наліво ── */
        @keyframes deuce-wipe-in  {
            0%   { transform: translateX(100%); }
            100% { transform: translateX(0%); }
        }
        @keyframes deuce-wipe-out {
            0%   { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }
        @keyframes deuce-txt-in {
            0%   { opacity: 0; letter-spacing: 12px; transform: translateY(4px); }
            100% { opacity: 1; letter-spacing: 5px;  transform: translateY(0); }
        }
        @keyframes deuce-txt-out {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }
        /* Контейнер — накриває inner-content (обидва рядки) */
        #deuce-wipe-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none; z-index: 30;
        }
        #deuce-wipe-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #4a235a 0%, #6c3483 60%, #7d3c98 100%);
            transform: translateX(100%);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.3);
        }
        #deuce-wipe-bg.dw-in  { animation: deuce-wipe-in  0.32s cubic-bezier(0.4,0,0.2,1) forwards; }
        #deuce-wipe-bg.dw-out { animation: deuce-wipe-out 0.32s cubic-bezier(0.4,0,0.2,1) forwards; }
        #deuce-wipe-label {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            gap: 18px;
            font-family: var(--team-font-family);
            font-size: calc(var(--sb-h) * 0.46);
            font-weight: 900; text-transform: uppercase; letter-spacing: 5px;
            color: #ffffff; white-space: nowrap; opacity: 0;
            text-shadow: 0 3px 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        #deuce-wipe-label .deuce-score {
            font-size: calc(var(--sb-h) * 0.28);
            opacity: 0.7; letter-spacing: 2px;
            font-weight: 700;
        }
        #deuce-wipe-label.dl-show {
            animation: deuce-txt-in  0.22s 0.26s ease forwards,
                       deuce-txt-out 0.20s 0.9s  ease forwards;
        }

        /* FAULT: wipe "DOUBLE FAULT" справа наліво поверх назви команди */
        @keyframes fault-wipe-in  {
            0%   { transform: translateX(100%); }
            100% { transform: translateX(0); }
        }
        @keyframes fault-wipe-out {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        @keyframes fault-txt-show {
            0%   { opacity: 0; transform: translateX(10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        /* Обгортка рядка — position:relative для абсолютного overlay */
        .player-row { position: relative; }
        /* Червона плашка що їде справа наліво */
        .fault-wipe-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; pointer-events: none; z-index: 20;
        }
        .fault-wipe-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #c0392b;
            transform: translateX(100%);
        }
        .fault-wipe-label {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--team-font-family); font-size: calc(var(--sb-h) * 0.26);
            font-weight: 900; text-transform: uppercase; letter-spacing: 3px;
            color: #ffffff; white-space: nowrap; opacity: 0;
            pointer-events: none;
        }
        .fault-wipe-bg.fw-in   { animation: fault-wipe-in  0.28s cubic-bezier(0.4,0,0.2,1) forwards; }
        .fault-wipe-bg.fw-out  { animation: fault-wipe-out 0.28s cubic-bezier(0.4,0,0.2,1) forwards; }
        .fault-wipe-label.fl-show { animation: fault-txt-show 0.22s 0.24s ease forwards; }

        /* ── BOTTOM NOTIF PLANK ── */
        @keyframes bn-slide-in  {
            0%   { transform: translateY(0);           opacity: 0; }
            100% { transform: translateY(calc(100% + 6px)); opacity: 1; }
        }
        @keyframes bn-slide-out {
            0%   { transform: translateY(calc(100% + 6px)); opacity: 1; }
            100% { transform: translateY(0);               opacity: 0; }
        }
        @keyframes bn-txt-in {
            0%   { opacity: 0; letter-spacing: 5px; }
            100% { opacity: 1; letter-spacing: 1.5px; }
        }
        #bottom-notif {
            position: absolute;
            bottom: 0; left: 8%; width: 84%;   /* трохи вужча — не на весь рядок */
            height: 30px;                        /* менша висота */
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 50;
            transform: translateY(0); opacity: 0;
        }
        .bn-bg {
            position: absolute; inset: 0;
            background: rgba(30,30,35,0.82);
            border-left: 4px solid var(--bn-color, var(--accent-blue));
            border-radius: 6px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 18px rgba(0,0,0,0.45);
        }
        .bn-bg::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: var(--bn-color, var(--accent-blue)); opacity: 0.5;
        }
        .bn-text {
            position: relative; z-index: 1;
            font-family: var(--team-font-family); font-size: 12px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: #ffffff; opacity: 0;
        }
        .bn-dot {
            position: relative; z-index: 1;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--bn-color, var(--accent-blue));
            box-shadow: 0 0 6px var(--bn-color, var(--accent-blue));
            margin-right: 8px; flex-shrink: 0; opacity: 0;
        }
        #bottom-notif.bn-show {
            animation: bn-slide-in 0.36s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        #bottom-notif.bn-hide {
            animation: bn-slide-out 0.28s cubic-bezier(0.4,0,0.2,1) forwards;
        }
        #bottom-notif.bn-show .bn-text { animation: bn-txt-in 0.22s 0.28s ease forwards; }
        #bottom-notif.bn-show .bn-dot  { animation: bn-txt-in 0.18s 0.26s ease forwards; }

        /* ── SPONSOR LOGOS BAR ── */
        #sponsor-logos-bar {
            position: fixed; top: 28px; right: 32px;
            display: flex; flex-direction: row; align-items: center;
            gap: 14px; z-index: 9000;
        }
        @keyframes logo-pop-in {
            0%  { opacity:0; transform:scale(0.55); }
            70% { transform:scale(1.06); }
            100%{ opacity:1; transform:scale(1); }
        }
        @keyframes logo-pop-out {
            0%  { opacity:1; transform:scale(1); }
            100%{ opacity:0; transform:scale(0.55); }
        }
        .sponsor-logo-wrap {
            width: 80px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(8px);
            box-shadow: 0 2px 14px rgba(0,0,0,0.28),
                        0 0 0 1px rgba(255,255,255,0.08);
            padding: 7px 10px; box-sizing: border-box;
            opacity: 0;
        }
        .sponsor-logo-wrap.slw-show {
            animation: logo-pop-in  0.42s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        .sponsor-logo-wrap.slw-hide {
            animation: logo-pop-out 0.28s ease forwards;
        }
        .sponsor-logo-wrap img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            filter: drop-shadow(0 1px 5px rgba(0,0,0,0.3));
        }

        /* VS INTRO */
        #match-intro-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 19000;

        #match-intro-overlay.active { opacity: 1; }

        .intro-team { font-family: var(--team-font-family); font-size: 48px; font-weight: 700; text-transform: uppercase; color: white; }
        .intro-vs { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 900; color: var(--accent-blue); opacity: 0.7; }
        .intro-court { font-size: 13px; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 3px; text-align: center; margin-top: 10px; }
    </style>

<!-- ═══════════════════════════════════════════════════ -->
<!-- ЗАМІНІТЬ ЦЕ НА ВАШІ ДАНІ FIREBASE                  -->
<!-- ═══════════════════════════════════════════════════ -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ⬇️ ВСТАВТЕ ВАШІ ДАНІ FIREBASE ТУТ ⬇️
    const firebaseConfig = {
        apiKey: "AIzaSyDf6PYBjF096FRE-fUUo5boS8jsieVS9xA",
        authDomain: "padel3-overley.firebaseapp.com",
        databaseURL: "https://padel3-overley-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "padel3-overley",
        storageBucket: "padel3-overley.firebasestorage.app",
        messagingSenderId: "1003185317510",
        appId: "1:1003185317510:web:07be70f0d0354a1f0bd307",
        measurementId: "G-HFRXC32BE1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const pts = [0, 15, 30, 40, "AD"];
    let lastAlertKey = "";
    let lastFaultTeam = null;
    let forceShowStats = false;
    let statsTimeout = null;

    // ── Черга анімацій ──────────────────────────────────────────
    let animQueue = [];
    let animBusy  = false;
    function enqueueAnim(fn, duration) {
        animQueue.push({ fn, duration });
        if (!animBusy) drainQueue();
    }
    function drainQueue() {
        if (animQueue.length === 0) { animBusy = false; return; }
        animBusy = true;
        const { fn, duration } = animQueue.shift();
        fn();
        setTimeout(drainQueue, duration);
    }

    // ── DEUCE WIPE функція ──────────────────────────────────────
    function playDeuceWipe(text, color) {
        const bg  = document.getElementById('deuce-wipe-bg');
        const lbl = document.getElementById('deuce-wipe-label');
        const txt = document.getElementById('deuce-wipe-text');
        const scr = document.getElementById('deuce-score-label');
        if (!bg || !lbl) return;

        // Колір фону залежно від типу
        if (color) bg.style.background = color;
        else bg.style.background = 'linear-gradient(135deg,#4a235a 0%,#6c3483 60%,#7d3c98 100%)';

        txt.textContent = text || 'DEUCE';
        scr.textContent = (text === 'DEUCE') ? '40 : 40' : '';

        // Reset
        bg.classList.remove('dw-in','dw-out');
        lbl.classList.remove('dl-show');
        void bg.offsetWidth;

        // Wipe IN
        bg.classList.add('dw-in');
        setTimeout(() => lbl.classList.add('dl-show'), 280);

        // Wipe OUT після 1.0с (загальна анімація ~1.3с)
        setTimeout(() => {
            lbl.classList.remove('dl-show');
            bg.classList.remove('dw-in');
            bg.classList.add('dw-out');
            setTimeout(() => bg.classList.remove('dw-out'), 320);
        }, 1000);
    }

    function updateStyle(p, v) { document.documentElement.style.setProperty(p, v); }

    function renderOverlay(d) {
        if (!d) return;
        const state = d.state || {};
        const ui = d.ui || {};
        const scores = state.scores || [0,0];
        const games = state.games || [0,0];
        const setsHistory = state.setsHistory || [[],[]];
        const server = state.server || 0;
        const isGameActive = state.isGameActive || false;
        const isTiebreak = state.isTiebreak || false;
        const isAmerican = state.isAmerican || false;
        const setTimes = state.setTimes || [0,0,0];
        const activeSetIndex = state.activeSetIndex || 0;
        const notifText = state.notifText || "";
        const showFinish = state.showFinish || false;
        const showIntro = state.showIntro || false;
        const showLogo = state.showLogo || false;
        const showBoard = state.showBoard !== false;
        const isProset = state.isProset || false;
        const prosetLimit = state.prosetLimit || 8;
        const p1name = state.p1name || "Команда А";
        const p2name = state.p2name || "Команда Б";
        const courtName = state.courtName || "COURT 1";

        // Apply UI styles
        if (ui.accentBlue) updateStyle('--accent-blue', ui.accentBlue);
        if (ui.ballColor) updateStyle('--ball-color', ui.ballColor);
        if (ui.panelBg) updateStyle('--panel-bg', ui.panelBg);
        if (ui.drawerBg) updateStyle('--drawer-bg', ui.drawerBg);
        if (ui.popupBg) updateStyle('--popup-bg', ui.popupBg);
        if (ui.popupText) updateStyle('--popup-text', ui.popupText);
        if (ui.teamNameColor) updateStyle('--team-name-color', ui.teamNameColor);
        if (ui.scoreColor) updateStyle('--score-num-color', ui.scoreColor);
        if (ui.finishBg) updateStyle('--finish-bg', ui.finishBg);
        if (ui.fontFamily) updateStyle('--team-font-family', ui.fontFamily);
        if (ui.sbW) updateStyle('--sb-w', ui.sbW);
        if (ui.sbH) updateStyle('--sb-h', ui.sbH);
        if (ui.sbRadius) updateStyle('--sb-radius', ui.sbRadius);
        if (ui.sbSkew) updateStyle('--sb-skew', ui.sbSkew);
        if (ui.sbScale) {
            const anchor = document.getElementById('scoreboard-anchor');
            anchor.style.transform = `scale(${ui.sbScale})`;
            anchor.style.transformOrigin = 'top left';
        }
        if (ui.logoW) updateStyle('--logo-w', ui.logoW);
        if (ui.logoH) updateStyle('--logo-h', ui.logoH);

        // Scoreboard position via CSS vars (cleaner, respects transitions)
        if (ui.sbTop  !== undefined) document.documentElement.style.setProperty('--sb-top',  ui.sbTop  + 'px');
        if (ui.sbLeft !== undefined) document.documentElement.style.setProperty('--sb-left', ui.sbLeft + 'px');

        // Names
        document.getElementById('p1-display').innerText = p1name;
        document.getElementById('p2-display').innerText = p2name;
        document.getElementById('intro-p1-display').innerText = p1name;
        document.getElementById('intro-p2-display').innerText = p2name;
        document.getElementById('intro-court-display').innerText = courtName;

        // Score display
        const getL = (i) => {
            if (isAmerican || isTiebreak) return scores[i];
            return scores[i] === 4 ? "AD" : (scores[1-i] === 4 ? "" : pts[scores[i]]);
        };
        document.getElementById('p1-score').innerText = getL(0);
        document.getElementById('p2-score').innerText = getL(1);
        document.getElementById('drawer').classList.toggle('points-active', isGameActive);

        // Fault wipe animation — через чергу
        const faultTeam = state.faultTeam;
        if (faultTeam !== undefined && faultTeam !== null && faultTeam !== lastFaultTeam) {
            lastFaultTeam = faultTeam;
            const rowEl = document.getElementById(`row-${faultTeam}`);
            if (rowEl) {
                enqueueAnim(() => {
                    let wrapEl = rowEl.querySelector('.fault-wipe-overlay');
                    if (!wrapEl) {
                        wrapEl = document.createElement('div');
                        wrapEl.className = 'fault-wipe-overlay';
                        wrapEl.innerHTML = '<div class="fault-wipe-bg"></div><div class="fault-wipe-label">DOUBLE FAULT</div>';
                        rowEl.appendChild(wrapEl);
                    }
                    const bgEl  = wrapEl.querySelector('.fault-wipe-bg');
                    const lblEl = wrapEl.querySelector('.fault-wipe-label');
                    bgEl.classList.remove('fw-in','fw-out');
                    lblEl.classList.remove('fl-show');
                    void bgEl.offsetWidth;
                    bgEl.classList.add('fw-in');
                    setTimeout(() => lblEl.classList.add('fl-show'), 240);
                    setTimeout(() => {
                        lblEl.classList.remove('fl-show');
                        bgEl.classList.remove('fw-in');
                        bgEl.classList.add('fw-out');
                        setTimeout(() => bgEl.classList.remove('fw-out'), 320);
                    }, 1200);
                }, 1600);
            }
        }

        // Logo
        if (ui.logoSrc) document.getElementById('logo-img').src = ui.logoSrc;
        document.getElementById('logo-container').classList.toggle('active', showLogo && !!ui.logoSrc);

        // Panels
        document.getElementById('tiebreak-panel').classList.toggle('active', isTiebreak);
        document.getElementById('proset-indicator').classList.toggle('active', isProset);
        if (isProset) document.getElementById('proset-indicator').innerText = `PRO-SET ${prosetLimit}`;



        // Bottom notif plank (game/break/set/break/golden point)
        const bnEl   = document.getElementById('bottom-notif');
        const bnText = document.getElementById('bn-text-el');
        const notif  = state.notifText || "";
        const prevNotif = bnEl.dataset.lastNotif || "";

        if (notif && notif !== prevNotif) {
            // Pick colour per type
            let bnColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-blue').trim() || '#0055ff';
            if (notif.includes('BREAK'))  bnColor = '#e67e22';
            if (notif.includes('SET'))    bnColor = '#9b59b6';
            if (notif.includes('GOLDEN')) bnColor = '#c8a200';
            bnEl.style.setProperty('--bn-color', bnColor);

            bnEl.dataset.lastNotif = notif;
            bnText.textContent = notif;

            // Reset animation
            bnEl.classList.remove('bn-show', 'bn-hide');
            void bnEl.offsetWidth;
            bnEl.classList.add('bn-show');
        } else if (!notif && prevNotif) {
            bnEl.dataset.lastNotif = '';
            bnEl.classList.remove('bn-show');
            bnEl.classList.add('bn-hide');
            setTimeout(() => bnEl.classList.remove('bn-hide'), 350);
        }

        // Serve dots & sets
        [0,1].forEach(p => {
            let h = "";
            setsHistory[p].forEach(g => h += `<div class="set-box-wrapper"><div class="set-box">${g}</div></div>`);
            h += `<div class="set-box-wrapper"><div class="set-box active">${games[p]}</div></div>`;
            document.getElementById(`p${p+1}-sets`).innerHTML = h;
            document.getElementById(`serve-${p}`).classList.toggle('active', server === p);
        });

        // Wipe + glow alert — через чергу анімацій
        const alertKey = state.alertKey || "";
        if (alertKey && alertKey !== lastAlertKey) {
            lastAlertKey = alertKey;
            const capturedMode = state.alertMode;
            const capturedText = state.alertText || "";

            // DEUCE → коротка плашка-wipe 1.3с
            // GOLDEN/BREAK/SET/TIEBREAK → fullscreen wipe 3с
            if (capturedMode === 'deuce') {
                enqueueAnim(() => playDeuceWipe('DEUCE', null), 1400);
            } else {
                enqueueAnim(() => {
                    const ring  = document.getElementById('sb-glow-ring');
                    const el    = document.getElementById('scoreboard-fullscreen-alert');
                    const txtEl = document.getElementById('fullscreen-alert-text');

                    const glowMap = { golden:'#c8a200', tiebreak:'#c0392b', normal:null };
                    const glowColor = glowMap[capturedMode] || '#0055ff';
                    ring.style.setProperty('--glow-color', glowColor);
                    el.style.setProperty('--glow-color', glowColor);

                    let bg = el.querySelector('.alert-wipe-bg');
                    if (!bg) { bg = document.createElement('div'); bg.className='alert-wipe-bg'; el.insertBefore(bg, txtEl); }

                    bg.classList.remove('wipe-in','wipe-out');
                    txtEl.classList.remove('txt-show');
                    void bg.offsetWidth;

                    txtEl.innerText = capturedText;
                    let cls = "alert-text-content";
                    if (capturedMode === 'golden')   cls += " alert-golden-theme";
                    if (capturedMode === 'tiebreak') cls += " alert-tiebreak-theme";
                    txtEl.className = cls;

                    ring.classList.remove('glow-out');
                    ring.classList.add('glow-active');
                    bg.style.background = glowColor;
                    bg.classList.add('wipe-in');

                    setTimeout(() => txtEl.classList.add('txt-show'), 260);

                    setTimeout(() => {
                        txtEl.classList.remove('txt-show');
                        bg.classList.remove('wipe-in');
                        bg.classList.add('wipe-out');
                        ring.classList.remove('glow-active');
                        ring.classList.add('glow-out');
                        setTimeout(() => {
                            bg.classList.remove('wipe-out');
                            ring.classList.remove('glow-out');
                        }, 350);
                    }, 2600);
                }, 3000);
            }
        }

        // Stats overlay
        if (state.showStats && !forceShowStats) {
            forceShowStats = true;
            updateStatsPanel(state);
            document.getElementById('tv-stats-overlay').classList.add('active');
            if (statsTimeout) clearTimeout(statsTimeout);
            statsTimeout = setTimeout(() => {
                forceShowStats = false;
                document.getElementById('tv-stats-overlay').classList.remove('active');
            }, 4000);
        }

        // Board visibility
        document.getElementById('scoreboard-anchor').classList.toggle('hidden-board', showBoard === false);

        // Intro & finish
        document.getElementById('match-intro-overlay').classList.toggle('active', showIntro);
        const finishOverlay = document.getElementById('match-finish-overlay');
        if (showFinish && !finishOverlay.classList.contains('active')) {
            // 1. Animate scoreboard digits
            animateScoreboardFinish(() => {
                // 2. Show result card
                updateFinishPanel(state);
                finishOverlay.classList.add('active');
            });
        } else if (!showFinish) {
            finishOverlay.classList.remove('active');
            // Restore scoreboard digits
            restoreScoreboardDigits();
        }

        // Stats logos
        if (ui.statLogoT) document.getElementById('stat-logo-t').src = ui.statLogoT;
        if (ui.statLogoF) document.getElementById('stat-logo-f').src = ui.statLogoF;

        // Sponsor logos bar (зверху-справа)
        renderSponsorLogos(ui.sponsorLogos || []);
    }

    function updateStatsPanel(state) {
        const n1 = state.p1name || "Команда А";
        const n2 = state.p2name || "Команда Б";
        const setsHistory = state.setsHistory || [[],[]];
        const games = state.games || [0,0];
        const activeSetIndex = state.activeSetIndex || 0;
        const setTimes = state.setTimes || [];      // завершені сети — зафіксований час
        const setStartTime = state._setStartTime;   // час старту поточного сету (ms)
        const isSetFinished = state._lastStatsIsSetEnd || false;

        let totalSets = Math.min(Math.max(activeSetIndex + 1, setsHistory[0].length, 1), 3);

        // Поточний elapsed для активного сету
        const nowElapsed = setStartTime
            ? Math.round((Date.now() - setStartTime) / 60000)
            : 0;

        let headHtml = `<tr style="color:rgba(255,255,255,0.32); font-size:11px; text-transform:uppercase; height:22px; letter-spacing:1px;">
            <th style="text-align:left; padding-left:6px;">Команда</th>`;
        for(let s=1; s<=totalSets; s++) headHtml += `<th style="width:100px;">Set ${s}</th>`;
        headHtml += `</tr>`;
        document.getElementById('stats-table-head').innerHTML = headHtml;

        let s1=[], s2=[];
        for(let i=0; i<totalSets; i++) {
            s1.push(setsHistory[0][i] !== undefined ? setsHistory[0][i] : (activeSetIndex===i ? games[0] : '-'));
            s2.push(setsHistory[1][i] !== undefined ? setsHistory[1][i] : (activeSetIndex===i ? games[1] : '-'));
        }

        // Час для кожного сету:
        // — завершені сети → фіксований час із setTimes[]
        // — поточний активний сет → поточний elapsed (скидається з нового сету)
        function getSetTime(i) {
            if (setsHistory[0][i] !== undefined) {
                // завершений сет — показуємо фіксований час
                return setTimes[i] > 0 ? `${setTimes[i]}'` : '';
            }
            // активний сет — поточний elapsed
            return nowElapsed > 0 ? `${nowElapsed}'` : '';
        }

        let bodyHtml = `<tr class="stats-row"><td class="stats-team-name">${n1}</td>`;
        for(let i=0; i<totalSets; i++) {
            const tLabel = getSetTime(i);
            bodyHtml += `<td class="stats-set-column">
                <div class="stats-games-num">${s1[i]}</div>
                ${tLabel ? `<div class="stats-time-label">${tLabel}</div>` : ''}
            </td>`;
        }
        bodyHtml += `</tr><tr class="stats-row" style="border:none;"><td class="stats-team-name">${n2}</td>`;
        for(let i=0; i<totalSets; i++) {
            bodyHtml += `<td class="stats-set-column"><div class="stats-games-num">${s2[i]}</div></td>`;
        }
        bodyHtml += `</tr>`;
        document.getElementById('stats-table-body').innerHTML = bodyHtml;
    }

    function updateFinishPanel(state) {
        const n1 = state.p1name || "Команда А";
        const n2 = state.p2name || "Команда Б";
        const sh = state.setsHistory || [[],[]];
        const st = state.setTimes || [];
        // Determine winner per set
        let html = `<tr class="finish-row"><td class="finish-team">${n1}</td>`;
        for(let i=0;i<3;i++){
            const v = sh[0][i]!==undefined?sh[0][i]:'-';
            const won = sh[0][i]!==undefined && sh[1][i]!==undefined && sh[0][i]>sh[1][i];
            html += `<td class="finish-cell-set"><span class="finish-box-score${won?' winner-box':''}">${v}</span>`;
            if(st[i] && i===0) html += `<div style="font-size:11px;color:#7eb8ff;margin-top:2px;font-weight:900;">${st[i]}'</div>`;
            html += `</td>`;
        }
        html += `</tr><tr class="finish-row" style="border:none;"><td class="finish-team">${n2}</td>`;
        for(let i=0;i<3;i++){
            const v = sh[1][i]!==undefined?sh[1][i]:'-';
            const won = sh[0][i]!==undefined && sh[1][i]!==undefined && sh[1][i]>sh[0][i];
            html += `<td class="finish-cell-set"><span class="finish-box-score${won?' winner-box':''}">${v}</span>`;
            if(st[i] && i>0) html += `<div style="font-size:11px;color:#7eb8ff;margin-top:2px;font-weight:900;">${st[i]}'</div>`;
            html += `</td>`;
        }
        html += `</tr>`;
        document.getElementById('finish-table-body').innerHTML = html;
    }

    // ─── SPONSOR LOGOS BAR ──────────────────────────────────────
    let _lastSponsorKeys = "";
    function renderSponsorLogos(logos) {
        const bar = document.getElementById('sponsor-logos-bar');
        const key = logos.map(l => l.src + l.visible).join('|');
        if (key === _lastSponsorKeys) return;
        _lastSponsorKeys = key;

        const visibleLogos = logos.filter(l => l.src && l.visible !== false);
        // Animate out old ones
        [...bar.children].forEach(el => {
            el.classList.remove('slw-show');
            el.classList.add('slw-hide');
        });
        setTimeout(() => {
            bar.innerHTML = '';
            visibleLogos.forEach((l, i) => {
                const wrap = document.createElement('div');
                wrap.className = 'sponsor-logo-wrap';
                const img = document.createElement('img');
                img.src = l.src;
                img.alt = '';
                wrap.appendChild(img);
                bar.appendChild(wrap);
                // Staggered pop-in
                setTimeout(() => wrap.classList.add('slw-show'), i * 80);
            });
        }, visibleLogos.length === 0 ? 0 : 300);
    }

    // ─── FINISH ANIMATION HELPERS ──────────────────────────────
    function animateScoreboardFinish(callback) {
        const anchor = document.getElementById('scoreboard-anchor');
        const digits = anchor.querySelectorAll('.set-box, .point-box, .player-name span');
        // Phase 1: breathing
        digits.forEach((el, i) => {
            el.innerHTML = `<span class="sb-digit breathing" style="animation-delay:${(i%4)*0.08}s">${el.textContent}</span>`;
        });
        // Phase 2: scatter after 1.0s
        setTimeout(() => {
            digits.forEach((el, i) => {
                const span = el.querySelector('.sb-digit');
                if (!span) return;
                span.classList.remove('breathing');
                const sx = (Math.random()-0.5)*160;
                const sy = (Math.random()*120+40)*(Math.random()>0.5?1:-1);
                span.style.setProperty('--sx', sx+'px');
                span.style.setProperty('--sy', sy+'px');
                span.style.animationDelay = (i*0.04)+'s';
                span.classList.add('scatter');
            });
            // Phase 3: hide board, show result
            setTimeout(() => {
                anchor.classList.add('hidden-board');
                if (callback) callback();
            }, 700);
        }, 1000);
    }

    function restoreScoreboardDigits() {
        const anchor = document.getElementById('scoreboard-anchor');
        anchor.classList.remove('hidden-board');
        // Digits will be re-rendered on next renderOverlay call
    }

    // ─── Читаємо номер корту з URL (?court=1, ?court=2 ...)
    const urlParams = new URLSearchParams(window.location.search);
    const courtId = urlParams.get('court') || '1';
    document.title = `Padel Overlay — Court ${courtId}`;

    // Listen to Firebase для потрібного корту
    const gameRef = ref(db, `padel/court${courtId}`);
    onValue(gameRef, (snapshot) => {
        renderOverlay(snapshot.val());
    });
</script>
</body>
</html>
